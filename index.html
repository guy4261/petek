<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>פתק</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; touch-action: none; }
    .tools { position: fixed; top: 20px; right: 20px; z-index: 2; display: flex; gap: 8px; }
    .tools button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #ddd; border-radius: 7px; background: #fff; color: #333; cursor: pointer; }
    .tools svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #notice { position: fixed; top: 76px; right: 20px; z-index: 3; max-width: calc(100vw - 40px); border: 0; border-radius: 8px; background: #262626; color: white; padding: 14px 18px; font: 14px Arial, sans-serif; cursor: pointer; }
    #angle { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: #777; font: 13px Arial, sans-serif; direction: ltr; font-variant-numeric: tabular-nums; }
    main { min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    .ballot {
      position: relative;
      width: min(300px, 56vw, 56svh);
      aspect-ratio: 210 / 297;
      container-type: inline-size;
      background: #fff;
      outline: 2px solid #b8b8b8;
      box-shadow: 0 12px 35px #00000012, 0 1px 3px #0000000d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transform: rotate(var(--angle, 0deg));
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .ballot.dragging { cursor: grabbing; }
    .text {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: #111;
      text-align: center;
      font-family: David, 'Times New Roman', serif;
      cursor: text;
      touch-action: auto;
      user-select: text;
      flex-shrink: 0;
    }
    .text:focus-visible { outline: 1px solid #dadada; outline-offset: 5px; }
    #letters { font-size: 38cqw; line-height: 1.1; font-weight: 700; height: 1.16em; }
    #caption { font-size: 7cqw; line-height: 1.35; min-height: 44px; resize: none; overflow: hidden; margin-top: 3cqw; }
  </style>
</head>
<body>
  <div class="tools">
    <button id="export" type="button" aria-label="שמירת תמונה" title="שמירת תמונה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
    <button id="copy" type="button" aria-label="העתקת תמונה" title="העתקת תמונה"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg></button>
    <button id="reset" type="button" aria-label="איפוס זווית וגדלי טקסט" title="איפוס זווית וגדלי טקסט"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
  </div>
  <button id="notice" type="button" role="status" hidden></button>
  <output id="angle" aria-label="זווית הסיבוב">0°</output>
  <main>
    <div class="ballot" id="ballot" role="group" aria-label="פתק הצבעה. גררו את הנייר לסיבוב">
      <input class="text" id="letters" aria-label="אותיות הפתק, עד שלוש אותיות" maxlength="3" value="כאן" autocomplete="off" spellcheck="false">
      <textarea class="text" id="caption" aria-label="המשפט שמתחת לאותיות" maxlength="80" rows="1" spellcheck="false">לוחצים כדי לשנות, גוררים כדי לסובב</textarea>
    </div>
  </main>
  <script>
    const ballot = document.getElementById('ballot');
    const caption = document.getElementById('caption');
    const letters = document.getElementById('letters');
    const angleMarker = document.getElementById('angle');
    let rotation = 0;
    let drag = null;
    const textSizes = { letters: 1, caption: 1 };
    const measure = document.createElement('canvas').getContext('2d');
    function normalizedAngle(value) { return ((value % 360) + 360) % 360; }
    function renderRotation() {
      ballot.style.setProperty('--angle', rotation + 'deg');
      angleMarker.value = Number(normalizedAngle(rotation).toFixed(1)) + '°';
    }
    function syncAddress() {
      const url = new URL(window.location.href);
      url.searchParams.set('letters', letters.value);
      url.searchParams.set('text', caption.value);
      url.searchParams.set('angle', String(Math.round(((rotation % 360 + 360) % 360) * 100) / 100));
      url.searchParams.set('upperSize', textSizes.letters.toFixed(3));
      url.searchParams.set('lowerSize', textSizes.caption.toFixed(3));
      history.replaceState(null, '', url.href);
    }
    function restoreAddress() {
      const params = new URL(window.location.href).searchParams;
      letters.value = (params.get('letters') ?? 'כאן').slice(0, 3);
      caption.value = (params.get('text') ?? 'לוחצים כדי לשנות, גוררים כדי לסובב').slice(0, 80);
      const angle = Number(params.get('angle') ?? 0);
      rotation = Number.isFinite(angle) ? normalizedAngle(angle) : 0;
      for (const [id, key] of [['letters', 'upperSize'], ['caption', 'lowerSize']]) {
        const size = Number(params.get(key) ?? 1);
        textSizes[id] = Number.isFinite(size) && size > 0 ? Math.max(0.7, Math.min(2.5, size)) : 1;
      }
      renderRotation();
      layoutText();
    }
    function fitCaption() {
      caption.style.height = 'auto';
      caption.style.height = caption.scrollHeight + 'px';
    }
    function layoutText() {
      const style = getComputedStyle(ballot);
      const width = ballot.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = ballot.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      let upper = Math.min(110, Math.max(24, width * 0.38 * textSizes.letters));
      let lower = Math.min(35, Math.max(12, width * 0.07 * textSizes.caption));
      // Fit the actual glyphs, including wide Latin letters, inside the text field.
      letters.style.fontSize = upper + 'px';
      measure.font = getComputedStyle(letters).font;
      const measuredWidth = measure.measureText(letters.value).width;
      if (measuredWidth > width - 4) upper *= (width - 4) / measuredWidth;
      caption.style.fontSize = lower + 'px';
      measure.font = getComputedStyle(caption).font;
      const longestWord = Math.max(0, ...caption.value.split(/\s+/u).map(word => measure.measureText(word).width));
      if (longestWord > width - 4) lower *= (width - 4) / longestWord;
      for (let i = 0; i < 100; i++) {
        letters.style.fontSize = upper + 'px';
        caption.style.fontSize = lower + 'px';
        fitCaption();
        const used = letters.offsetHeight + caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop);
        if (used <= height) break;
        upper *= 0.95;
        lower *= 0.95;
      }
    }
    function resizeText(field, factor) {
      textSizes[field.id] = Math.max(0.7, Math.min(2.5, textSizes[field.id] * factor));
      layoutText();
      syncAddress();
    }
    for (const field of [letters, caption]) {
      field.addEventListener('input', () => { layoutText(); syncAddress(); });
    }
    function fieldForPageY(y) {
      return y < window.innerHeight / 2 ? letters : caption;
    }
    document.addEventListener('wheel', event => {
      if (!event.deltaY) return;
      event.preventDefault();
      resizeText(fieldForPageY(event.clientY), event.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });
    let pinch = null;
    let tap = null;
    let suppressTouchClick = false;
    function touchDistance(touches) {
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }
    // Delay opening the keyboard until a one-finger tap is complete.
    document.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'touch') { suppressTouchClick = false; return; }
      const field = event.target.closest('input, textarea');
      if (field && document.activeElement !== field) field.readOnly = true;
    }, true);
    document.addEventListener('touchstart', event => {
      if (event.touches.length === 1) {
        suppressTouchClick = false;
        const touch = event.touches[0];
        tap = { field: touch.target.closest('input, textarea'), x: touch.clientX, y: touch.clientY };
      }
      if (event.touches.length !== 2) return;
      event.preventDefault();
      tap = null;
      suppressTouchClick = true;
      if (drag) endDrag({ pointerId: drag.id });
      document.activeElement?.blur();
      const y = (event.touches[0].clientY + event.touches[1].clientY) / 2;
      pinch = { field: fieldForPageY(y), distance: touchDistance(event.touches) };
    }, { passive: false, capture: true });
    document.addEventListener('touchmove', event => {
      if (tap && event.touches.length === 1 && Math.hypot(event.touches[0].clientX - tap.x, event.touches[0].clientY - tap.y) > 8) tap = null;
      if (!pinch || event.touches.length !== 2) return;
      event.preventDefault();
      const distance = touchDistance(event.touches);
      if (pinch.distance >= 20 && distance >= 20) {
        const factor = Math.pow(distance / pinch.distance, 0.3);
        resizeText(pinch.field, Math.max(0.98, Math.min(1.02, factor)));
      }
      pinch.distance = distance;
    }, { passive: false, capture: true });
    document.addEventListener('touchend', event => {
      if (suppressTouchClick) event.preventDefault();
      if (!event.touches.length) {
        if (tap?.field && !suppressTouchClick) {
          event.preventDefault();
          tap.field.readOnly = false;
          tap.field.focus();
        }
        tap = null;
        pinch = null;
        letters.readOnly = caption.readOnly = false;
      }
    }, { passive: false, capture: true });
    document.addEventListener('touchcancel', () => {
      tap = pinch = null;
      letters.readOnly = caption.readOnly = false;
    }, { capture: true });
    document.addEventListener('click', event => {
      if (suppressTouchClick) { event.preventDefault(); event.stopPropagation(); }
    }, true);
    window.addEventListener('popstate', restoreAddress);
    new ResizeObserver(layoutText).observe(ballot);
    function pointerAngle(event, center) {
      return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
    }
    ballot.addEventListener('pointerdown', event => {
      if (pinch || event.target.closest('input, textarea') || event.button !== 0 || drag) return;
      const rect = ballot.getBoundingClientRect();
      const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      drag = { id: event.pointerId, center, last: pointerAngle(event, center), raw: rotation };
      document.activeElement.blur();
      ballot.setPointerCapture(event.pointerId);
      ballot.classList.add('dragging');
      event.preventDefault();
    });
    ballot.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const angle = pointerAngle(event, drag.center);
      const delta = ((angle - drag.last + 540) % 360) - 180;
      drag.raw += delta;
      const normalized = normalizedAngle(drag.raw);
      rotation = Math.min(normalized, 360 - normalized) <= 5 ? Math.round(drag.raw / 360) * 360 : drag.raw;
      drag.last = angle;
      renderRotation();
      syncAddress();
    });
    function endDrag(event) {
      if (!drag || event.pointerId !== drag.id) return;
      drag = null;
      ballot.classList.remove('dragging');
      if (ballot.hasPointerCapture(event.pointerId)) ballot.releasePointerCapture(event.pointerId);
    }
    ballot.addEventListener('pointerup', endDrag);
    ballot.addEventListener('pointercancel', endDrag);
    ballot.addEventListener('lostpointercapture', endDrag);
    function wrapWords(ctx, text, width) {
      const lines = [];
      for (const paragraph of text.split('\n')) {
        let line = '';
        for (const word of paragraph.match(/\S+/gu) ?? []) {
          const candidate = line ? line + ' ' + word : word;
          if (line && ctx.measureText(candidate).width > width) {
            lines.push(line);
            line = word;
          } else { line = candidate; }
        }
        lines.push(line);
      }
      return lines;
    }
    let noticeTimer;
    const notice = document.getElementById('notice');
    function showNotice(text) {
      clearTimeout(noticeTimer);
      notice.textContent = text;
      notice.hidden = false;
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 4000);
    }
    notice.addEventListener('click', () => { notice.hidden = true; clearTimeout(noticeTimer); });
    document.getElementById('reset').addEventListener('click', () => {
      rotation = 0;
      textSizes.letters = textSizes.caption = 1;
      renderRotation();
      layoutText();
      syncAddress();
    });
    async function renderPNG() {
        await document.fonts.ready;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const width = ballot.offsetWidth;
        const height = ballot.offsetHeight;
        const radians = normalizedAngle(rotation) * Math.PI / 180;
        const bounds = Math.max(Math.abs(Math.cos(radians)) * width + Math.abs(Math.sin(radians)) * height, Math.abs(Math.sin(radians)) * width + Math.abs(Math.cos(radians)) * height);
        const scale = 960 / bounds;
        ctx.translate(512, 512);
        ctx.scale(scale, scale);
        ctx.rotate(radians);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-width / 2, -height / 2, width, height);
        ctx.strokeStyle = '#b8b8b8';
        ctx.lineWidth = 2;
        ctx.strokeRect(-width / 2, -height / 2, width, height);
        ctx.fillStyle = '#111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'rtl';
        const captionStyle = getComputedStyle(caption);
        ctx.font = captionStyle.font;
        const lines = wrapWords(ctx, caption.value, caption.clientWidth);
        // Use the live fields' positions so both the screen and export share the same layout.
        const top = -height / 2;
        ctx.font = getComputedStyle(letters).font;
        ctx.fillText(letters.value, 0, top + letters.offsetTop + letters.offsetHeight / 2);
        ctx.font = captionStyle.font;
        const lineHeight = parseFloat(captionStyle.lineHeight);
        lines.forEach((line, index) => ctx.fillText(line, 0, top + caption.offsetTop + lineHeight * (index + 0.5)));
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('PNG export failed');

        return blob;
    }
    function downloadPNG(blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'petek.png';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    document.getElementById('export').addEventListener('click', async () => {
      const button = document.getElementById('export');
      button.disabled = true;
      try {
        const blob = await renderPNG();
        const file = new File([blob], 'petek.png', { type: 'image/png' });
        const isTouchDevice = matchMedia('(pointer: coarse)').matches;
        if (isTouchDevice && navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file] });
        } else { downloadPNG(blob); }
      } catch (error) {
        if (error.name !== 'AbortError') showNotice('לא ניתן לשמור את התמונה. נסו שוב.');
      } finally { button.disabled = false; }
    });
    document.getElementById('copy').addEventListener('click', async () => {
      const button = document.getElementById('copy');
      button.disabled = true;
      try {
        if (!navigator.clipboard?.write || !window.ClipboardItem) throw new Error('Clipboard unavailable');
        // Safari requires starting the write in the original click handler.
        const png = renderPNG();
        png.catch(() => {});
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
        showNotice('הועתק! פייסט בווטסאפ לקבלת סטיקר');
      } catch {
        showNotice('ההעתקה לא הצליחה. אפשר לשמור את התמונה במקום.');
      } finally { button.disabled = false; }
    });
    restoreAddress();
    syncAddress();
  </script>
</body>
</html>
