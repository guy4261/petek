<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>פתק</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    #export { position: fixed; top: 20px; right: 20px; z-index: 2; padding: 10px 16px; border: 1px solid #ddd; border-radius: 7px; background: #fff; color: #333; font: 14px Arial, sans-serif; cursor: pointer; }
    #angle { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); color: #777; font: 13px Arial, sans-serif; direction: ltr; font-variant-numeric: tabular-nums; }
    main { min-height: 100svh; display: grid; place-items: center; overflow: hidden; }
    .ballot {
      position: relative;
      width: min(300px, 56vw, 56svh);
      aspect-ratio: 210 / 297;
      container-type: inline-size;
      background: #fff;
      outline: 2px solid #b8b8b8;
      box-shadow: 0 12px 35px #00000012, 0 1px 3px #0000000d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transform: rotate(var(--angle, 0deg));
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .ballot.dragging { cursor: grabbing; }
    .text {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: #111;
      text-align: center;
      font-family: 'Times New Roman', serif;
      cursor: text;
      touch-action: auto;
      user-select: text;
      flex-shrink: 0;
    }
    .text:focus-visible { outline: 1px solid #dadada; outline-offset: 5px; }
    #letters { font-size: 38cqw; line-height: 1.1; font-weight: 700; height: 1.16em; }
    #caption { font-size: 7cqw; line-height: 1.35; resize: none; overflow: hidden; margin-top: 3cqw; }
  </style>
</head>
<body>
  <button id="export" type="button">העתקה ושמירת תמונה ↓</button>
  <output id="angle" aria-label="זווית הסיבוב">0°</output>
  <main>
    <div class="ballot" id="ballot" role="group" aria-label="פתק הצבעה. גררו את הנייר לסיבוב">
      <input class="text" id="letters" aria-label="אותיות הפתק, עד שלוש אותיות" maxlength="3" value="כאן" autocomplete="off" spellcheck="false">
      <textarea class="text" id="caption" aria-label="המשפט שמתחת לאותיות" maxlength="80" rows="1" spellcheck="false">לוחצים כדי לשנות, גוררים כדי לסובב</textarea>
    </div>
  </main>
  <script>
    const ballot = document.getElementById('ballot');
    const caption = document.getElementById('caption');
    const letters = document.getElementById('letters');
    const angleMarker = document.getElementById('angle');
    let rotation = 0;
    let drag = null;
    const textSizes = { letters: 1, caption: 1 };
    const measure = document.createElement('canvas').getContext('2d');
    function normalizedAngle(value) { return ((value % 360) + 360) % 360; }
    function renderRotation() {
      ballot.style.setProperty('--angle', rotation + 'deg');
      angleMarker.value = Number(normalizedAngle(rotation).toFixed(1)) + '°';
    }
    function syncAddress() {
      const url = new URL(window.location.href);
      url.searchParams.set('letters', letters.value);
      url.searchParams.set('text', caption.value);
      url.searchParams.set('angle', String(Math.round(((rotation % 360 + 360) % 360) * 100) / 100));
      url.searchParams.set('upperSize', textSizes.letters.toFixed(3));
      url.searchParams.set('lowerSize', textSizes.caption.toFixed(3));
      history.replaceState(null, '', url.href);
    }
    function restoreAddress() {
      const params = new URL(window.location.href).searchParams;
      letters.value = (params.get('letters') ?? 'כאן').slice(0, 3);
      caption.value = (params.get('text') ?? 'לוחצים כדי לשנות, גוררים כדי לסובב').slice(0, 80);
      const angle = Number(params.get('angle') ?? 0);
      rotation = Number.isFinite(angle) ? normalizedAngle(angle) : 0;
      for (const [id, key] of [['letters', 'upperSize'], ['caption', 'lowerSize']]) {
        const size = Number(params.get(key) ?? 1);
        textSizes[id] = Number.isFinite(size) && size > 0 ? Math.max(0.2, Math.min(5, size)) : 1;
      }
      renderRotation();
      layoutText();
    }
    function fitCaption() {
      caption.style.height = 'auto';
      caption.style.height = caption.scrollHeight + 'px';
    }
    function layoutText() {
      const style = getComputedStyle(ballot);
      const width = ballot.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = ballot.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      let upper = width * 0.38 * textSizes.letters;
      let lower = width * 0.07 * textSizes.caption;
      // Fit the actual glyphs, including wide Latin letters, inside the text field.
      letters.style.fontSize = upper + 'px';
      measure.font = getComputedStyle(letters).font;
      const measuredWidth = measure.measureText(letters.value).width;
      if (measuredWidth > width - 4) upper *= (width - 4) / measuredWidth;
      caption.style.fontSize = lower + 'px';
      measure.font = getComputedStyle(caption).font;
      const longestWord = Math.max(0, ...caption.value.split(/\s+/u).map(word => measure.measureText(word).width));
      if (longestWord > width - 4) lower *= (width - 4) / longestWord;
      for (let i = 0; i < 100; i++) {
        letters.style.fontSize = upper + 'px';
        caption.style.fontSize = lower + 'px';
        fitCaption();
        const used = letters.offsetHeight + caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop);
        if (used <= height) break;
        upper *= 0.95;
        lower *= 0.95;
      }
    }
    function resizeText(field, factor) {
      textSizes[field.id] = Math.max(0.2, Math.min(5, textSizes[field.id] * factor));
      layoutText();
      syncAddress();
    }
    for (const field of [letters, caption]) {
      field.addEventListener('input', () => { layoutText(); syncAddress(); });
    }
    // Keep the wheel target usable even when a small caption is only a few pixels high
    // or resizing moves it out from underneath the pointer.
    ballot.addEventListener('wheel', event => {
      if (!event.deltaY) return;
      event.preventDefault();
      let field = event.target.closest('input, textarea');
      if (!field) {
        const rect = ballot.getBoundingClientRect();
        const radians = rotation * Math.PI / 180;
        const dx = event.clientX - (rect.left + rect.width / 2);
        const dy = event.clientY - (rect.top + rect.height / 2);
        const localY = -dx * Math.sin(radians) + dy * Math.cos(radians) + ballot.offsetHeight / 2;
        const boundary = (letters.offsetTop + letters.offsetHeight + caption.offsetTop) / 2;
        field = localY >= boundary ? caption : letters;
      }
      resizeText(field, event.deltaY < 0 ? 1.15 : 1 / 1.15);
    }, { passive: false });
    let pinch = null;
    function touchDistance(touches) {
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }
    ballot.addEventListener('touchstart', event => {
      if (event.touches.length !== 2) return;
      const field = event.touches[0].target.closest('input, textarea');
      if (!field) return;
      event.preventDefault();
      pinch = { field, distance: touchDistance(event.touches) };
    }, { passive: false });
    ballot.addEventListener('touchmove', event => {
      if (!pinch || event.touches.length !== 2) return;
      event.preventDefault();
      const distance = touchDistance(event.touches);
      if (pinch.distance > 0 && distance > 0) resizeText(pinch.field, distance / pinch.distance);
      pinch.distance = distance;
    }, { passive: false });
    for (const name of ['touchend', 'touchcancel']) ballot.addEventListener(name, () => { pinch = null; });
    window.addEventListener('popstate', restoreAddress);
    new ResizeObserver(layoutText).observe(ballot);
    function pointerAngle(event, center) {
      return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
    }
    ballot.addEventListener('pointerdown', event => {
      if (event.target.closest('input, textarea') || event.button !== 0 || drag) return;
      const rect = ballot.getBoundingClientRect();
      const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      drag = { id: event.pointerId, center, last: pointerAngle(event, center), raw: rotation };
      document.activeElement.blur();
      ballot.setPointerCapture(event.pointerId);
      ballot.classList.add('dragging');
      event.preventDefault();
    });
    ballot.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.id) return;
      const angle = pointerAngle(event, drag.center);
      const delta = ((angle - drag.last + 540) % 360) - 180;
      drag.raw += delta;
      const normalized = normalizedAngle(drag.raw);
      rotation = Math.min(normalized, 360 - normalized) <= 5 ? Math.round(drag.raw / 360) * 360 : drag.raw;
      drag.last = angle;
      renderRotation();
      syncAddress();
    });
    function endDrag(event) {
      if (!drag || event.pointerId !== drag.id) return;
      drag = null;
      ballot.classList.remove('dragging');
      if (ballot.hasPointerCapture(event.pointerId)) ballot.releasePointerCapture(event.pointerId);
    }
    ballot.addEventListener('pointerup', endDrag);
    ballot.addEventListener('pointercancel', endDrag);
    ballot.addEventListener('lostpointercapture', endDrag);
    function wrapWords(ctx, text, width) {
      const lines = [];
      for (const paragraph of text.split('\n')) {
        let line = '';
        for (const word of paragraph.match(/\S+/gu) ?? []) {
          const candidate = line ? line + ' ' + word : word;
          if (line && ctx.measureText(candidate).width > width) {
            lines.push(line);
            line = word;
          } else { line = candidate; }
        }
        lines.push(line);
      }
      return lines;
    }
    document.getElementById('export').addEventListener('click', async () => {
      const button = document.getElementById('export');
      button.disabled = true;
      // Start the clipboard write during the click, before asynchronous PNG rendering.
      let resolvePNG, rejectPNG;
      const pngPromise = new Promise((resolve, reject) => { resolvePNG = resolve; rejectPNG = reject; });
      pngPromise.catch(() => {});
      let copied = Promise.resolve(false);
      if (navigator.clipboard?.write && window.ClipboardItem) {
        try {
          copied = navigator.clipboard.write([new ClipboardItem({ 'image/png': pngPromise })]).then(() => true, () => false);
        } catch { /* Saving remains available when clipboard images are unsupported. */ }
      }
      try {
        await document.fonts.ready;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        const width = ballot.offsetWidth;
        const height = ballot.offsetHeight;
        const radians = normalizedAngle(rotation) * Math.PI / 180;
        const bounds = Math.max(Math.abs(Math.cos(radians)) * width + Math.abs(Math.sin(radians)) * height, Math.abs(Math.sin(radians)) * width + Math.abs(Math.cos(radians)) * height);
        const scale = 960 / bounds;
        ctx.translate(512, 512);
        ctx.scale(scale, scale);
        ctx.rotate(radians);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-width / 2, -height / 2, width, height);
        ctx.strokeStyle = '#b8b8b8';
        ctx.lineWidth = 2;
        ctx.strokeRect(-width / 2, -height / 2, width, height);
        ctx.fillStyle = '#111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'rtl';
        const captionStyle = getComputedStyle(caption);
        ctx.font = captionStyle.font;
        const lines = wrapWords(ctx, caption.value, caption.clientWidth);
        // Use the live fields' positions so both the screen and export share the same layout.
        const top = -height / 2;
        ctx.font = getComputedStyle(letters).font;
        ctx.fillText(letters.value, 0, top + letters.offsetTop + letters.offsetHeight / 2);
        ctx.font = captionStyle.font;
        const lineHeight = parseFloat(captionStyle.lineHeight);
        lines.forEach((line, index) => ctx.fillText(line, 0, top + caption.offsetTop + lineHeight * (index + 0.5)));
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('PNG export failed');
        resolvePNG(blob);
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'petek.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        button.textContent = await copied ? 'התמונה הועתקה ונשמרה ✓' : 'התמונה נשמרה ✓';
        setTimeout(() => { button.textContent = 'העתקה ושמירת תמונה ↓'; }, 3000);
      } catch (error) {
        rejectPNG(error);
        console.error(error);
        alert('לא ניתן לשמור את התמונה. נסו שוב.');
      } finally { button.disabled = false; }
    });
    restoreAddress();
    syncAddress();
  </script>
</body>
</html>
